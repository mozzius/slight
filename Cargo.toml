[workspace]
resolver = "2"
members = [
    "rust/acp-types",
    "rust/acp-adapters",
    "rust/session-store",
    "rust/session-core",
    "rust/gateway-protocol",
    "rust/gateway-server",
    "rust/host-service",
    "rust/host-cli",
    "rust/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anomalyco/slight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
agent-client-protocol-schema = { version = "1.7", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

acp-types = { path = "rust/acp-types" }
acp-adapters = { path = "rust/acp-adapters" }
session-store = { path = "rust/session-store" }
session-core = { path = "rust/session-core" }
gateway-protocol = { path = "rust/gateway-protocol" }
gateway-server = { path = "rust/gateway-server" }
host-service = { path = "rust/host-service" }
test-support = { path = "rust/test-support" }
